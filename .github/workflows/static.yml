name: Deploy JARVIS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Prepare GitHub Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp -r dist/. site/

          touch site/.nojekyll

          echo "=== PAGES SITE ==="
          find site -maxdepth 3 -type f -print

          echo "=== ASSETS ==="
          ls -lah site/assets

      - name: Verify asset files
        run: |
          test -f site/index.html
          test -f site/assets/index-PyY-iPzW.js
          test -f site/assets/index-Dyvi6G26.css
          echo "JARVIS frontend files verified successfully."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy JARVIS
        id: deployment
        uses: actions/deploy-pages@v4
